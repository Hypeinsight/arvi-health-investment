<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Arvi Dev Pipeline</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#060d16;
  --panel:rgba(255,255,255,.035);
  --card:rgba(10,20,32,.72);
  --line:rgba(120,180,210,.16);
  --ink:#eaf6fb;
  --ink-soft:#8fa9bb;
  --neon-teal:#12f7d6;
  --neon-lime:#7cff5c;
  --neon-amber:#ffb020;
  --neon-violet:#a06bff;
  --neon-blue:#3fa9ff;
  --neon-pink:#ff6bd6;
  --neon-red:#ff5c7a;
  --radius:16px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:'IBM Plex Sans',system-ui,sans-serif;
  background:var(--bg);color:var(--ink);line-height:1.5;
  padding:40px 32px 64px;min-height:100vh;position:relative;overflow-x:hidden;
}
body:before,body:after{content:"";position:fixed;border-radius:50%;filter:blur(120px);z-index:0;pointer-events:none}
body:before{width:520px;height:520px;background:rgba(18,247,214,.16);left:-160px;top:-180px;animation:drift 22s ease-in-out infinite}
body:after{width:460px;height:460px;background:rgba(160,107,255,.14);right:-140px;bottom:-160px;animation:drift 26s ease-in-out infinite reverse}
@keyframes drift{50%{transform:translate3d(70px,60px,0) scale(1.15)}}
.wrap{max-width:1680px;margin:0 auto;position:relative;z-index:1}

header{display:flex;flex-wrap:wrap;gap:28px;align-items:flex-end;justify-content:space-between;
  border-bottom:1px solid var(--line);padding-bottom:26px}
.brand{display:flex;align-items:center;gap:20px}
.titles h1{font-size:clamp(22px,2.4vw,30px)}
.logo{height:54px;width:auto;flex:none;filter:drop-shadow(0 0 16px rgba(18,247,214,.45));animation:pulse 6s ease-in-out infinite}
@keyframes pulse{50%{filter:drop-shadow(0 0 30px rgba(160,107,255,.8))}}
h1{font-size:clamp(26px,3.2vw,40px);font-weight:600;letter-spacing:-.02em;text-shadow:0 0 26px rgba(18,247,214,.35)}
.sub{color:var(--ink-soft);font-size:15px;margin-top:5px}

.progress{min-width:260px;flex:1;max-width:360px}
.progress .row{display:flex;justify-content:space-between;font-size:13px;color:var(--ink-soft);margin-bottom:8px}
#pct{color:var(--neon-teal);font-weight:600;text-shadow:0 0 12px rgba(18,247,214,.6)}
.bar{height:9px;border-radius:6px;background:rgba(255,255,255,.07);overflow:hidden}
.bar i{display:block;height:100%;width:0;border-radius:6px;
  background:linear-gradient(90deg,var(--neon-teal),var(--neon-lime),var(--neon-violet),var(--neon-teal));
  background-size:300% 100%;animation:flow 5s linear infinite;
  box-shadow:0 0 18px rgba(18,247,214,.7);transition:width .6s cubic-bezier(.2,.8,.2,1)}
@keyframes flow{to{background-position:300% 0}}

.tools{display:flex;flex-wrap:wrap;gap:10px;margin:24px 0 4px;align-items:center}
button{font:inherit;cursor:pointer;border:1px solid var(--line);background:rgba(255,255,255,.04);
  color:var(--ink);border-radius:10px;padding:9px 15px;font-size:14px;transition:.2s}
button:hover{border-color:var(--neon-teal);box-shadow:0 0 16px rgba(18,247,214,.28);color:#fff}
button:focus-visible,.card:focus-visible{outline:2px solid var(--neon-teal);outline-offset:3px}
button.primary{background:linear-gradient(90deg,rgba(18,247,214,.16),rgba(160,107,255,.16));
  border-color:rgba(18,247,214,.5);box-shadow:0 0 20px rgba(18,247,214,.22)}
.hint{color:var(--ink-soft);font-size:13px;margin-left:auto}
.dbstat{margin-left:auto;display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink-soft);
  border:1px solid var(--line);border-radius:20px;padding:6px 14px;max-width:100%}
.dbstat .dot{width:8px;height:8px;border-radius:50%;flex:none;background:var(--ink-soft)}
.dbstat.live .dot{background:var(--neon-lime);box-shadow:0 0 10px var(--neon-lime)}
.dbstat.live{color:var(--neon-lime);border-color:rgba(124,255,92,.35)}
.dbstat.warn .dot{background:var(--neon-amber);box-shadow:0 0 10px var(--neon-amber)}
.dbstat.warn{color:var(--neon-amber);border-color:rgba(255,176,32,.4)}
.dbstat.bad .dot{background:var(--neon-red);box-shadow:0 0 10px var(--neon-red)}
.dbstat.bad{color:var(--neon-red);border-color:rgba(255,92,122,.45)}

.board{display:grid;grid-template-columns:repeat(6,1fr);gap:14px;margin-top:24px;align-items:start}
.col{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:16px 14px 6px;
  min-height:340px;backdrop-filter:blur(8px);transition:.25s}
.col.over{border-color:var(--neon-teal);box-shadow:0 0 34px rgba(18,247,214,.28) inset,0 0 22px rgba(18,247,214,.2)}
.colhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.colhead h2{font-size:17px;font-weight:600;display:flex;align-items:center;gap:9px}
.led{width:8px;height:8px;border-radius:50%;animation:blink 2.6s ease-in-out infinite}
[data-key="done"] .led{background:var(--neon-lime);box-shadow:0 0 12px var(--neon-lime)}
[data-key="qa"] .led{background:var(--neon-amber);box-shadow:0 0 12px var(--neon-amber);animation-duration:1.4s}
[data-key="dev"] .led{background:var(--neon-blue);box-shadow:0 0 12px var(--neon-blue);animation-duration:1.8s}
[data-key="deploy"] .led{background:var(--neon-teal);box-shadow:0 0 12px var(--neon-teal);animation-duration:1.1s}
[data-key="research"] .led{background:var(--neon-pink);box-shadow:0 0 12px var(--neon-pink);animation-duration:3.2s}
[data-key="next"] .led{background:var(--neon-violet);box-shadow:0 0 12px var(--neon-violet)}
@keyframes blink{50%{opacity:.35}}
.tally{font-size:13px;font-weight:600;border:1px solid var(--line);border-radius:20px;padding:3px 12px;color:var(--ink-soft)}

.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
  padding:17px 19px 15px;margin-bottom:14px;position:relative;overflow:hidden;cursor:grab;
  transition:transform .2s,box-shadow .25s,border-color .25s;animation:rise .45s both}
@keyframes rise{from{opacity:0;transform:translateY(10px)}}
.card:before{content:"";position:absolute;inset:0 auto 0 0;width:4px}
[data-key="done"] .card:before{background:var(--neon-lime);box-shadow:0 0 16px var(--neon-lime)}
[data-key="qa"] .card:before{background:var(--neon-amber);box-shadow:0 0 16px var(--neon-amber)}
[data-key="dev"] .card:before{background:var(--neon-blue);box-shadow:0 0 16px var(--neon-blue)}
[data-key="deploy"] .card:before{background:var(--neon-teal);box-shadow:0 0 16px var(--neon-teal)}
[data-key="research"] .card:before{background:var(--neon-pink);box-shadow:0 0 16px var(--neon-pink)}
[data-key="next"] .card:before{background:var(--neon-violet);box-shadow:0 0 16px var(--neon-violet)}
.card:hover{transform:translateY(-3px);border-color:rgba(18,247,214,.45);
  box-shadow:0 12px 34px rgba(0,0,0,.45),0 0 22px rgba(18,247,214,.18)}
.card.dragging{opacity:.5;box-shadow:0 0 30px rgba(18,247,214,.5)}
.card.landed{animation:landed .8s ease}
.card.insert{box-shadow:0 -3px 0 var(--neon-teal),0 0 22px rgba(18,247,214,.3)}
@keyframes landed{0%{box-shadow:0 0 0 rgba(18,247,214,0)}35%{box-shadow:0 0 36px rgba(18,247,214,.75)}}
.head{display:flex;align-items:center;gap:11px;margin-bottom:7px}
.ico{width:32px;height:32px;flex:none;border-radius:9px;display:grid;place-items:center;
  border:1px solid var(--line);background:rgba(255,255,255,.04)}
.ico svg{width:17px;height:17px;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
[data-key="done"] .ico{border-color:rgba(124,255,92,.4);box-shadow:0 0 14px rgba(124,255,92,.15)}
[data-key="done"] .ico svg{stroke:var(--neon-lime)}
[data-key="qa"] .ico{border-color:rgba(255,176,32,.4);box-shadow:0 0 14px rgba(255,176,32,.15)}
[data-key="qa"] .ico svg{stroke:var(--neon-amber)}
[data-key="dev"] .ico{border-color:rgba(63,169,255,.4);box-shadow:0 0 14px rgba(63,169,255,.15)}
[data-key="dev"] .ico svg{stroke:var(--neon-blue)}
[data-key="deploy"] .ico{border-color:rgba(18,247,214,.4);box-shadow:0 0 14px rgba(18,247,214,.15)}
[data-key="deploy"] .ico svg{stroke:var(--neon-teal)}
[data-key="research"] .ico{border-color:rgba(255,107,214,.4);box-shadow:0 0 14px rgba(255,107,214,.15)}
[data-key="research"] .ico svg{stroke:var(--neon-pink)}
[data-key="next"] .ico{border-color:rgba(160,107,255,.4);box-shadow:0 0 14px rgba(160,107,255,.15)}
[data-key="next"] .ico svg{stroke:var(--neon-violet)}
.card:hover .ico{box-shadow:0 0 20px rgba(18,247,214,.35)}
.card h3{font-size:17px;font-weight:600}
.card p{color:var(--ink-soft);font-size:14px}
.meta{display:flex;align-items:center;gap:9px;margin-top:13px;flex-wrap:wrap}
.chip{font-size:12px;font-weight:600;border-radius:14px;padding:3px 11px;border:1px solid}
[data-key="done"] .chip{color:var(--neon-lime);border-color:rgba(124,255,92,.4);box-shadow:0 0 12px rgba(124,255,92,.18)}
[data-key="qa"] .chip{color:var(--neon-amber);border-color:rgba(255,176,32,.4);box-shadow:0 0 12px rgba(255,176,32,.18)}
[data-key="dev"] .chip{color:var(--neon-blue);border-color:rgba(63,169,255,.4);box-shadow:0 0 12px rgba(63,169,255,.18)}
[data-key="deploy"] .chip{color:var(--neon-teal);border-color:rgba(18,247,214,.45);box-shadow:0 0 12px rgba(18,247,214,.18)}
[data-key="research"] .chip{color:var(--neon-pink);border-color:rgba(255,107,214,.4);box-shadow:0 0 12px rgba(255,107,214,.18)}
[data-key="next"] .chip{color:var(--neon-violet);border-color:rgba(160,107,255,.4);box-shadow:0 0 12px rgba(160,107,255,.18)}
.owner{font-size:12px;color:var(--ink-soft)}
.due{font-size:12px;font-weight:600;border-radius:14px;padding:3px 11px;border:1px solid rgba(120,180,210,.28);
  color:var(--ink-soft);display:inline-flex;align-items:center;gap:6px}
.due b{font-weight:600}
.due.soon{color:var(--neon-amber);border-color:rgba(255,176,32,.45);box-shadow:0 0 12px rgba(255,176,32,.18)}
.due.late{color:var(--neon-red);border-color:rgba(255,92,122,.5);box-shadow:0 0 12px rgba(255,92,122,.22)}
.due.met{color:var(--neon-lime);border-color:rgba(124,255,92,.35)}
button.due{font:inherit;cursor:pointer;background:rgba(255,255,255,.04);transition:.18s}
button.due:hover{border-color:var(--neon-teal);box-shadow:0 0 14px rgba(18,247,214,.3);color:#fff}
button.due.empty{border-style:dashed;color:var(--ink-soft)}
.move{margin-left:auto;display:flex;gap:5px;opacity:0;transition:opacity .18s}
.card:hover .move,.card:focus-within .move{opacity:1}
.move button{padding:2px 9px;font-size:13px;border-radius:8px}
.empty{border:1px dashed rgba(120,180,210,.3);border-radius:var(--radius);padding:18px;
  color:var(--ink-soft);font-size:14px;margin-bottom:14px}
.colhead h2{cursor:pointer;user-select:none}
.caret{display:inline-block;transition:transform .2s;font-size:11px;color:var(--ink-soft)}
.col.folded .caret{transform:rotate(-90deg)}
.folded-note{color:var(--ink-soft);font-size:13px;padding:4px 2px 14px}
.more{width:100%;margin-bottom:14px;border-style:dashed;color:var(--ink-soft);
  display:flex;align-items:center;justify-content:center;gap:8px}
.more:hover{color:#fff}
.more .n{font-weight:600;color:var(--neon-teal)}
.stack{position:relative}
.stack.clipped:after{content:"";position:absolute;left:0;right:0;bottom:14px;height:56px;pointer-events:none;
  background:linear-gradient(to bottom,rgba(6,13,22,0),rgba(6,13,22,.92))}

dialog{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);margin:0;
  border:1px solid rgba(18,247,214,.35);border-radius:18px;padding:28px;width:min(440px,92vw);
  max-height:88vh;overflow:auto;background:#0a1522;color:var(--ink);box-shadow:0 0 60px rgba(18,247,214,.25)}
dialog[open]{animation:pop .25s cubic-bezier(.2,.9,.3,1.2)}
@keyframes pop{from{opacity:0;transform:translate(-50%,-50%) scale(.94)}}
dialog::backdrop{background:rgba(3,8,14,.72);backdrop-filter:blur(4px)}
dialog h3{font-size:19px;font-weight:600;margin-bottom:14px}
label{display:block;font-size:13px;color:var(--ink-soft);margin:13px 0 5px}
input,textarea,select{width:100%;font:inherit;padding:10px 12px;border:1px solid var(--line);
  border-radius:10px;background:rgba(255,255,255,.05);color:var(--ink)}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--neon-teal);box-shadow:0 0 16px rgba(18,247,214,.25)}
select option{background:#0a1522}
textarea{min-height:74px;resize:vertical}
.actions{display:flex;gap:10px;justify-content:flex-end;margin-top:24px}
footer{margin-top:36px;padding-top:18px;border-top:1px solid var(--line);color:var(--ink-soft);
  font-size:13px;display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px}

@media (max-width:1500px){.board{grid-template-columns:repeat(3,1fr)}}
@media (max-width:1050px){.board{grid-template-columns:repeat(2,1fr)}}
@media (max-width:760px){.board{grid-template-columns:1fr}body{padding:26px 18px 48px}.move{opacity:1}}
@media (prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}
</style>
</head>

    <span>Arvi Health client feature update &nbsp;&middot;&nbsp; drag cards to reorder or move columns</span>

    <button id="d-cancel">Cancel</button>
    <button class="primary" id="d-save">Save</button>

<script>
const COLS=[{key:'done',name:'Done'},{key:'deploy',name:'Next deployment'},{key:'qa',name:'Under QA'},{key:'dev',name:'Under development'},{key:'next',name:'Coming next'},{key:'research',name:'Under research'}];
const PLAN=[
 {id:1,col:'done',name:'Global recording',icon:'recording',desc:'Recording keeps running in the background as users move between pages and tabs.',owner:'Shan',due:''},
 {id:2,col:'done',name:'Global dictation',icon:'dictation',desc:'A keyboard shortcut turns speech into text in whichever field is active.',owner:'Oshan',due:''},
 {id:3,col:'done',name:'Tour guide',icon:'tour',desc:'In-app prompts explain what has changed after each platform update.',owner:'To be assigned',due:''},
 {id:4,col:'done',name:'Dark mode',icon:'dark',desc:'A low-light theme applied consistently across every screen.',owner:'Oshan',due:''},
 {id:5,col:'qa',name:'Patient summary',icon:'summary',desc:'Key patient details brought together in one place inside patient details.',owner:'Sachithra',due:''},
 {id:6,col:'next',name:'Letter memory',icon:'memory',desc:'Pulls relevant content from past letters when a new one is drafted.',owner:'Shan',due:''},
 {id:7,col:'next',name:'Voice assistance',icon:'voice',desc:'Spoken commands and requests that go beyond dictation, hands-free.',owner:'To be assigned',due:''},
 {id:8,col:'next',name:'Live letter generation',icon:'letter',desc:'The letter is written on screen as it is produced, instead of a loading screen.',owner:'To be assigned',due:''},
 {id:9,col:'next',name:'Practice mode',icon:'practice',desc:'New users learn the system with sample data before working on real records.',owner:'To be assigned',due:''}
];

const ICONS={
 recording:'<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="3.2"/>',
 dictation:'<rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/>',
 tour:'<circle cx="12" cy="12" r="9"/><path d="M15.5 8.5 13 13l-4.5 2.5L11 11z"/>',
 dark:'<path d="M20 14.5A8.2 8.2 0 0 1 9.5 4 8.5 8.5 0 1 0 20 14.5z"/>',
 summary:'<rect x="4" y="3" width="16" height="18" rx="2.5"/><path d="M8 8h8M8 12h8M8 16h5"/>',
 memory:'<path d="M4 6h16v9H4z"/><path d="m4 7 8 5 8-5"/><circle cx="18" cy="17.5" r="3.5"/><path d="M18 16v1.6l1 .7"/>',
 voice:'<path d="M4 10v4M8 6v12M12 3v18M16 6v12M20 10v4"/>',
 letter:'<path d="M5 3h9l5 5v13H5z"/><path d="M14 3v5h5"/><path d="M8 13h6M8 17h3"/><path d="M17.5 16v5" stroke-width="2.6"/>',
 practice:'<path d="M12 4 3 8.5 12 13l9-4.5z"/><path d="M7 11v4.5c0 1.4 2.2 2.5 5 2.5s5-1.1 5-2.5V11"/>',
 spark:'<path d="M12 4v16M4 12h16"/>'
};
const MARK='=== BOARD DATA (needed to load this file back, please do not edit) ===';
const KEY='arvi:feature-board';
let items=PLAN.map(o=>({...o})), editing=null, justMoved=null;

const board=document.getElementById('board');
const dlg=document.getElementById('dlg');

/* ---------- the .txt file is the database ---------- */
const FS_OK = typeof window!=='undefined' && 'showSaveFilePicker' in window;
let fileHandle=null, lastSaved=null, saveTimer=null, saving=false, dirty=false;

function idbOpen(){
  return new Promise((res,rej)=>{
    const r=indexedDB.open('arvi-board',1);
    r.onupgradeneeded=()=>r.result.createObjectStore('kv');
    r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error);
  });
}
async function idbGet(k){
  try{const db=await idbOpen();
    return await new Promise((res,rej)=>{
      const q=db.transaction('kv','readonly').objectStore('kv').get(k);
      q.onsuccess=()=>res(q.result); q.onerror=()=>rej(q.error);});
  }catch(e){return null}
}
async function idbSet(k,v){
  try{const db=await idbOpen();
    const tx=db.transaction('kv','readwrite'); tx.objectStore('kv').put(v,k);
    return await new Promise(res=>{tx.oncomplete=res; tx.onerror=res});
  }catch(e){}
}

function setStatus(state,text){
  const el=document.getElementById('dbstat');
  el.className='dbstat '+(state||'');
  document.getElementById('dbtext').textContent=text;
  var _rl=document.getElementById('relink'); if(_rl)_rl.hidden = state!=='warn';
}
function savedNote(){
  return 'Saved to '+(fileHandle?fileHandle.name:'file')+' at '+
    (lastSaved||new Date()).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit',second:'2-digit'});
}
async function hasPerm(handle,ask){
  try{
    const opts={mode:'readwrite'};
    if(await handle.queryPermission(opts)==='granted')return true;
    if(ask && await handle.requestPermission(opts)==='granted')return true;
  }catch(e){}
  return false;
}
async function writeFile(){
  if(!fileHandle)return false;
  if(saving){dirty=true;return false;}
  saving=true;
  try{
    if(!await hasPerm(fileHandle,false)){
      setStatus('warn','File access paused. Click Reconnect file.');
      return false;
    }
    const w=await fileHandle.createWritable();
    await w.write(buildText());
    await w.close();
    lastSaved=new Date();
    setStatus('live',savedNote());
    return true;
  }catch(e){
    setStatus('bad','Could not write to the file: '+(e.message||e));
    return false;
  }finally{
    saving=false;
    if(dirty){dirty=false;scheduleSave();}
  }
}
function scheduleSave(){
  if(!fileHandle)return;
  clearTimeout(saveTimer);
  saveTimer=setTimeout(writeFile,350);
}
function parseText(txt){
  const at=txt.indexOf(MARK);
  if(at<0)throw new Error('no board data found in that file');
  const data=JSON.parse(txt.slice(at+MARK.length).trim());
  if(!Array.isArray(data))throw new Error('board data is not a list');
  return data.map(o=>({due:'',...o}));
}
async function readFromHandle(){
  const f=await fileHandle.getFile();
  const txt=await f.text();
  if(!txt.trim()){await writeFile();return;}
  items=parseText(txt);
  render();
  lastSaved=new Date(f.lastModified);
  setStatus('live','Loaded from '+fileHandle.name);
}
async function linkHandle(h,mode){
  fileHandle=h;
  await idbSet('handle',h);
  try{
    if(mode==='open')await readFromHandle();
    else await writeFile();
  }catch(e){
    setStatus('bad','That file could not be read: '+(e.message||e));
  }
}
async function openDb(){
  if(!FS_OK)return noFsNotice();
  try{
    const [h]=await window.showOpenFilePicker({types:[{description:'Text file',accept:{'text/plain':['.txt']}}]});
    if(await hasPerm(h,true))await linkHandle(h,'open');
  }catch(e){}
}
async function newDb(){
  if(!FS_OK)return noFsNotice();
  try{
    const h=await window.showSaveFilePicker({suggestedName:'arvi-feature-status.txt',
      types:[{description:'Text file',accept:{'text/plain':['.txt']}}]});
    await linkHandle(h,'new');
  }catch(e){}
}
function noFsNotice(){
  alert('This browser cannot write straight to a file. Open this page in Chrome or Edge on your Mac, '+
        'or keep using Download a copy and Load from .txt file.');
}
/* file-picker buttons removed: the board now saves to the shared server automatically */

/* ---------- shared board: read/write via the server API ---------- */
const API='api/board';
let serverVersion=0, saving2=false, pendingSave=false, dirtyLocal=false, saveTimer2=null, polling=false;

async function load(){
  try{
    const r=await fetch(API,{cache:'no-store'});
    if(!r.ok)throw new Error('HTTP '+r.status);
    const d=await r.json();
    if(Array.isArray(d.items))items=d.items;
    serverVersion=d.updatedAt||0;
    try{localStorage.setItem(KEY,JSON.stringify(items));}catch(e){}
    setStatus('live','Shared board - synced');
  }catch(e){
    try{const c=localStorage.getItem(KEY); if(c)items=JSON.parse(c);}catch(_){}
    setStatus('bad','Offline - edits are not being shared');
  }
  render();
  startPolling();
}

async function persist(){
  stamp();
  dirtyLocal=true;
  try{localStorage.setItem(KEY,JSON.stringify(items));}catch(e){}
  clearTimeout(saveTimer2);
  setStatus('','Saving...');
  saveTimer2=setTimeout(saveToServer,400);
}

async function saveToServer(){
  if(saving2){pendingSave=true;return;}
  saving2=true;
  try{
    const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({text:buildText()})});
    if(!r.ok)throw new Error('HTTP '+r.status);
    const d=await r.json();
    if(d&&d.updatedAt)serverVersion=d.updatedAt;
    dirtyLocal=false;
    setStatus('live','Saved for everyone'+(d&&d.updatedAt?' at '+new Date(d.updatedAt).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'}):''));
  }catch(e){
    setStatus('bad','Could not save to the server - retrying');
    pendingSave=true;
  }finally{
    saving2=false;
    if(pendingSave){pendingSave=false;clearTimeout(saveTimer2);saveTimer2=setTimeout(saveToServer,1200);}
  }
}

function anyDialogOpen(){
  try{ if(typeof dlg!=='undefined'&&dlg.open)return true; }catch(e){}
  try{ if(typeof dueDlg!=='undefined'&&dueDlg.open)return true; }catch(e){}
  return false;
}
function startPolling(){
  if(polling)return; polling=true;
  setInterval(async()=>{
    if(document.hidden||saving2||dirtyLocal||anyDialogOpen())return;
    try{
      const r=await fetch(API,{cache:'no-store'});
      if(!r.ok)return;
      const d=await r.json();
      if(d&&d.updatedAt&&d.updatedAt!==serverVersion){
        if(Array.isArray(d.items))items=d.items;
        serverVersion=d.updatedAt;
        try{localStorage.setItem(KEY,JSON.stringify(items));}catch(e){}
        render();
        setStatus('live','Updated with team changes');
      }
    }catch(e){}
  },5000);
}
function stamp(){
  document.getElementById('stamp').textContent='Updated '+new Date().toLocaleDateString(undefined,{day:'numeric',month:'short',year:'numeric'});
}
function chipFor(col,i){
  if(col==='done')return'Done';
  if(col==='deploy')return'Deploying';
  if(col==='qa')return'In QA';
  if(col==='dev')return'Building';
  if(col==='research')return'Research';
  return ['1st','2nd','3rd','4th','5th','6th','7th','8th','9th'][i]||'Queued';
}
function fmtDate(iso){
  const d=new Date(iso+'T00:00:00');
  if(isNaN(d))return iso;
  return d.toLocaleDateString(undefined,{day:'numeric',month:'short',year:'numeric'});
}
function dueState(it){
  if(!it.due)return{cls:'',label:''};
  const today=new Date();today.setHours(0,0,0,0);
  const d=new Date(it.due+'T00:00:00');
  const days=Math.round((d-today)/86400000);
  if(it.col==='done')return{cls:'met',label:'Delivered by '+fmtDate(it.due)};
  if(days<0)return{cls:'late',label:'Overdue: '+fmtDate(it.due)};
  if(days===0)return{cls:'late',label:'Due today: '+fmtDate(it.due)};
  if(days<=7)return{cls:'soon',label:'Due in '+days+(days===1?' day: ':' days: ')+fmtDate(it.due)};
  return{cls:'',label:'Due '+fmtDate(it.due)};
}

const SHOW=4;
const expanded=new Set(), folded=new Set();
function wireDrop(col,c){
  col.addEventListener('dragover',ev=>{ev.preventDefault();col.classList.add('over')});
  col.addEventListener('dragleave',()=>col.classList.remove('over'));
  col.addEventListener('drop',ev=>{
    ev.preventDefault();col.classList.remove('over');
    const id=+ev.dataTransfer.getData('text/plain');
    if(ev.altKey){const src=items.find(x=>x.id===id); if(src)duplicate(src,c.key); return;}
    if(folded.has(c.key))folded.delete(c.key);
    moveItem(id,c.key,null);
  });
}
function render(){
  board.innerHTML='';
  COLS.forEach(c=>{
    const list=items.filter(i=>i.col===c.key);
    const col=document.createElement('section');
    col.className='col'+(folded.has(c.key)?' folded':'');col.dataset.key=c.key;
    col.innerHTML='<div class="colhead"><h2><span class="led"></span>'+c.name+
      '<span class="caret">&#9660;</span></h2><span class="tally">'+list.length+'</span></div>';
    col.querySelector('.colhead h2').onclick=()=>{
      folded.has(c.key)?folded.delete(c.key):folded.add(c.key);
      render();
    };
    if(folded.has(c.key)){
      const n=document.createElement('div');n.className='folded-note';
      n.textContent=list.length?list.length+(list.length===1?' feature hidden':' features hidden'):'Empty';
      col.appendChild(n);
      wireDrop(col,c);board.appendChild(col);return;
    }
    if(!list.length){
      const e=document.createElement('div');e.className='empty';
      e.textContent={qa:'Nothing in testing right now.',dev:'Nothing being built right now.',
        deploy:'Nothing queued for the next release.',research:'Nothing being researched right now.'}[c.key]
        ||'Drop a feature here.';
      col.appendChild(e);
    }
    if(justMoved!=null && list.findIndex(x=>x.id===justMoved)>=SHOW)expanded.add(c.key);
    const open=expanded.has(c.key), over=list.length-SHOW;
    const shown=open?list:list.slice(0,SHOW);
    const stack=document.createElement('div');
    stack.className='stack'+(!open&&over>0?' clipped':'');
    shown.forEach((it,i)=>{
      const el=cardEl(it,i);
      el.style.animationDelay=(i*60)+'ms';
      if(justMoved===it.id){el.classList.add('landed');justMoved=null;}
      stack.appendChild(el);
    });
    col.appendChild(stack);
    if(over>0){
      const b=document.createElement('button');
      b.className='more';
      b.innerHTML=open?'Show less':'Show <span class="n">'+over+'</span> more';
      b.onclick=()=>{open?expanded.delete(c.key):expanded.add(c.key);render()};
      col.appendChild(b);
    }
    wireDrop(col,c);
    board.appendChild(col);
  });
  const done=items.filter(i=>i.col==='done').length;
  const pct=items.length?Math.round(done/items.length*100):0;
  document.getElementById('pct').textContent=pct+'%';
  document.getElementById('fill').style.width=pct+'%';
}

function cardEl(it,i){
  const el=document.createElement('article');
  el.className='card';el.draggable=true;el.tabIndex=0;
  el.innerHTML='<div class="head"><span class="ico"><svg viewBox="0 0 24 24">'+(ICONS[it.icon]||ICONS.spark)+
    '</svg></span><h3></h3></div><p></p><div class="meta"><span class="chip">'+chipFor(it.col,i)+
    '</span><span class="owner"></span><span class="move">'+
    '<button aria-label="Move left" title="Move left">&#8592;</button>'+
    '<button aria-label="Duplicate this card" title="Duplicate">&#10697;</button>'+
    '<button aria-label="Move right" title="Move right">&#8594;</button></span></div>';
  el.querySelector('h3').textContent=it.name;
  el.querySelector('p').textContent=it.desc;
  el.querySelector('.owner').textContent=it.owner?'Owner: '+it.owner:'';
  const ds=dueState(it);
  if(ds.label||it.col==='dev'){
    const due=document.createElement('button');
    due.type='button';
    due.className='due '+(ds.label?ds.cls:'empty');
    due.textContent=ds.label||'Set deadline';
    due.title='Click to change the deadline';
    due.onclick=e=>{e.stopPropagation();openDue(it)};
    el.querySelector('.meta').insertBefore(due,el.querySelector('.owner'));
  }
  const mv=el.querySelectorAll('.move button');
  mv[0].onclick=e=>{e.stopPropagation();shift(it,-1)};
  mv[1].onclick=e=>{e.stopPropagation();duplicate(it)};
  mv[2].onclick=e=>{e.stopPropagation();shift(it,1)};
  el.addEventListener('dblclick',()=>openDlg(it));
  el.addEventListener('keydown',e=>{if(e.key==='Enter')openDlg(it)});
  el.addEventListener('dragstart',ev=>{ev.dataTransfer.setData('text/plain',it.id);el.classList.add('dragging')});
  el.addEventListener('dragend',()=>el.classList.remove('dragging'));
  el.addEventListener('dragover',ev=>{ev.preventDefault();ev.stopPropagation();el.classList.add('insert')});
  el.addEventListener('dragleave',()=>el.classList.remove('insert'));
  el.addEventListener('drop',ev=>{
    ev.preventDefault();ev.stopPropagation();el.classList.remove('insert');
    moveItem(+ev.dataTransfer.getData('text/plain'),it.col,it.id);
  });
  return el;
}

function moveItem(id,col,beforeId){
  const it=items.find(x=>x.id===id);
  if(!it||id===beforeId)return;
  it.col=col;
  const rest=items.filter(x=>x.id!==id);
  const at=beforeId==null?-1:rest.findIndex(x=>x.id===beforeId);
  if(at<0)rest.push(it); else rest.splice(at,0,it);
  items=rest;justMoved=id;render();persist();
}
function duplicate(it,col){
  const copy={...it,id:Date.now()+Math.floor(Math.random()*1000),col:col||it.col};
  const rest=items.slice();
  rest.splice(rest.findIndex(x=>x.id===it.id)+1,0,copy);
  items=rest;justMoved=copy.id;render();persist();
  return copy;
}
function shift(it,dir){
  const idx=COLS.findIndex(c=>c.key===it.col)+dir;
  if(idx<0||idx>=COLS.length)return;
  moveItem(it.id,COLS[idx].key,null);
}

function openDlg(it){
  editing=it||null;
  document.getElementById('dlgTitle').textContent=it?'Edit feature':'Add a feature';
  document.getElementById('f-name').value=it?it.name:'';
  document.getElementById('f-desc').value=it?it.desc:'';
  document.getElementById('f-owner').value=it?it.owner:'';
  document.getElementById('f-icon').value=it&&it.icon?it.icon:'spark';
  document.getElementById('f-col').value=it?it.col:'next';
  document.getElementById('f-due').value=it&&it.due?it.due:'';
  document.getElementById('del').style.display=it?'inline-block':'none';
  document.getElementById('dup').style.display=it?'inline-block':'none';
  dlg.showModal();
  document.getElementById('f-name').focus();
}

document.getElementById('add').onclick=()=>openDlg(null);
document.getElementById('cancel').onclick=()=>dlg.close();
document.getElementById('del').onclick=()=>{items=items.filter(x=>x!==editing);dlg.close();render();persist()};
document.getElementById('dup').onclick=()=>{
  if(!editing)return;
  const src=editing;
  dlg.close();
  const copy=duplicate(src);
  openDlg(copy);
};
document.getElementById('save').onclick=()=>{
  const name=document.getElementById('f-name').value.trim();
  if(!name){document.getElementById('f-name').focus();return}
  const data={name,desc:document.getElementById('f-desc').value.trim(),
    owner:document.getElementById('f-owner').value.trim()||'To be assigned',
    icon:document.getElementById('f-icon').value,
    col:document.getElementById('f-col').value,
    due:document.getElementById('f-due').value};
  if(editing){Object.assign(editing,data);justMoved=editing.id;}
  else{const n={id:Date.now(),...data};items.push(n);justMoved=n.id;}
  dlg.close();render();persist();
};
document.getElementById('reset').onclick=()=>{items=PLAN.map(o=>({...o}));render();persist()};

const dueDlg=document.getElementById('dueDlg');
let dueEditing=null;
function openDue(it){
  dueEditing=it;
  document.getElementById('dueTitle').textContent='Deadline: '+it.name;
  document.getElementById('d-date').value=it.due||'';
  dueDlg.showModal();
  document.getElementById('d-date').focus();
}
function commitDue(v){
  if(!dueEditing)return;
  dueEditing.due=v;
  justMoved=dueEditing.id;
  dueDlg.close();dueEditing=null;
  render();persist();
}
document.getElementById('d-save').onclick=()=>commitDue(document.getElementById('d-date').value);
document.getElementById('d-clear').onclick=()=>commitDue('');
document.getElementById('d-cancel').onclick=()=>{dueDlg.close();dueEditing=null};
function buildText(){
  const now=new Date();
  const done=items.filter(i=>i.col==='done').length;
  const pct=items.length?Math.round(done/items.length*100):0;
  const L=[];
  L.push('ARVI HEALTH - FEATURE STATUS');
  L.push('Saved: '+now.toLocaleDateString(undefined,{day:'numeric',month:'short',year:'numeric'})+' '+now.toLocaleTimeString());
  L.push('Delivered: '+pct+'% ('+done+' of '+items.length+')');
  L.push('');
  COLS.forEach(c=>{
    const list=items.filter(i=>i.col===c.key);
    L.push(c.name.toUpperCase()+' ('+list.length+')');
    L.push('------------------------------------------------------------');
    if(!list.length)L.push('  (nothing here)');
    list.forEach((it,n)=>{
      L.push('  '+(n+1)+'. '+it.name);
      L.push('     Owner: '+(it.owner||'To be assigned'));
      L.push('     Deadline: '+(it.due?fmtDate(it.due)+(dueState(it).cls==='late'?'  [OVERDUE]':''):'not set'));
      if(it.desc)L.push('     '+it.desc);
    });
    L.push('');
  });
  L.push(MARK);
  L.push(JSON.stringify(items));
  return L.join('\r\n');
}
document.getElementById('export').onclick=()=>{
  const blob=new Blob([buildText()],{type:'text/plain;charset=utf-8'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url;
  a.download='arvi-feature-status-'+new Date().toISOString().slice(0,10)+'.txt';
  document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),1000);
};
stamp();load();
